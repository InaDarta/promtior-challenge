spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

# Railway inyecta el puerto a exponer en PORT, no en SERVER_PORT.
server:
  port: ${PORT:8080}
  error:
    # TEMPORAL: para diagnosticar el 500 de /api/chat en el deploy real. Revertir después.
    include-message: always

app:
  jwt:
    # Sin default: el de application.yml es solo para dev/tests, nunca para un despliegue real.
    secret: ${JWT_SECRET}
