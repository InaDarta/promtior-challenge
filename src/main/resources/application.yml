spring:
  application:
    name: booking-agent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${SPRING_DATASOURCE_USERNAME:booking}
    password: ${SPRING_DATASOURCE_PASSWORD:booking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    # Clave HS256 en base64 (>= 256 bits). El default solo alcanza para dev/tests locales -- en
    # cualquier despliegue real hay que fijar JWT_SECRET con un valor propio. Ver ADR 0006.
    secret: ${JWT_SECRET:1+3i4e8C3sz0BOsZi3rLlmWmRiUd2p7zyvQZI072KThUIuI2vNW9c8RY8d8XWOvv}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  llm:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model-name: ${GEMINI_MODEL_NAME:gemini-3.7-flash}
      # Techo bajo a propósito: el tier gratuito tiene RPD=20, y un reintento sin límite puede
      # agotar el cupo diario en minutos. Ver ADR 0009.
      max-retries: ${GEMINI_MAX_RETRIES:2}
    groq:
      api-key: ${GROQ_API_KEY:}
      model-name: ${GROQ_MODEL_NAME:llama-3.3-70b-versatile}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_MODEL_NAME:llama3.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
